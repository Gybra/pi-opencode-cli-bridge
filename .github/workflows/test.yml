name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.19.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Real CLI against a local model fixture; OpenCode's own postinstall fetches its platform binary.
      - name: Install pinned OpenCode
        run: npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund opencode-ai@1.19.0
      - run: npm run test:integration
        env:
          OPENCODE_PI_INTEGRATION_BIN: ${{ runner.temp }}/opencode/node_modules/.bin/opencode
      - name: Install pinned OpenCode 2
        run: npm install --prefix "$RUNNER_TEMP/opencode-v2" --no-audit --no-fund @opencode/cli@2.0.32
      - name: Test OpenCode 2 native-tool guard
        run: npm run test:integration
        env:
          OPENCODE_PI_INTEGRATION_BIN: ${{ runner.temp }}/opencode-v2/node_modules/.bin/opencode
      - name: Package contents
        run: npm pack --dry-run
